name: Setup video env
description: Node, Python, FFmpeg, font tiếng Việt, edge-tts, Chrome cho HyperFrames, và skill của 2 repo upstream.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
    - name: Python packages
      shell: bash
      run: |
        python -m pip install -q -U edge-tts
        python -m pip install -q --no-deps vieneu==3.8.3
        python -m pip install -q -r scripts/requirements-vieneu.txt
    - name: VieNeu model cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: vieneu-3.8.3-v3turbo
    - name: Upstream skills (sparse)
      shell: bash
      run: bash scripts/fetch-upstream.sh
    - name: HyperFrames browser
      shell: bash
      run: |
        npx -y hyperframes telemetry disable || true
        npx -y hyperframes browser ensure
    - name: Check env
      shell: bash
      run: python .claude/skills/video-pipeline/scripts/check_env.py
